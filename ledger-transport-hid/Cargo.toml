[package]
name = "ledger-transport-hid"
description = "Ledger Hardware Wallet - HID Transport"
version = "0.11.0"
license = "Apache-2.0"
authors = ["Zondax AG <hello@zondax.ch>"]
homepage = "https://github.com/zondax/ledger-rs"
repository = "https://github.com/zondax/ledger-rs"
readme = "README.md"
categories  = ["authentication", "cryptography"]
keywords = ["ledger", "nano", "blue", "apdu"]
edition = "2021"

[features]
default = ["hidapi-backend-linux-static-hidraw"]
hidapi-backend-linux-static-hidraw = ["hidapi/linux-static-hidraw"]
hidapi-backend-linux-static-libusb = ["hidapi/linux-static-libusb", "dep:hid-report"]

[dependencies]
libc = "0.2"
byteorder = "1.5"
cfg-if = "1"
thiserror = "1"
hex = "0.4"
log = "0.4"

ledger-transport = "0.11.0"
hidapi = { version = "2.6.1", default-features = false }
hid-report = { version = "1.0.0", optional = true }

[dev-dependencies]
once_cell = "1"
ledger-zondax-generic = "0.11.0"
serial_test = "3"
env_logger = "0.11"
futures = "0.3"
